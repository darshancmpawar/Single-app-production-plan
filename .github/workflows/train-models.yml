name: Train Models

# Manual-only. Triggered from Actions → Train Models → Run workflow.
on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client key (e.g. tekion, clario, ...) or "all"'
        required: true
        default: 'all'
      force:
        description: 'Retrain even if artifacts already exist'
        type: boolean
        required: false
        default: false

# Allow the bot to commit refreshed artifacts back to the branch.
permissions:
  contents: write

# Never run two trainings in parallel — they'd contend on the same files.
concurrency:
  group: train-models
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train
        run: |
          set -e
          ARGS=( --client "${{ inputs.client }}" )
          if [[ "${{ inputs.force }}" == "true" ]]; then
            ARGS+=( --force )
          fi
          python scripts/train.py "${ARGS[@]}"

      - name: Show artifact diff
        run: |
          git status --short artifacts/ || true
          du -sh artifacts/ || true

      - name: Commit refreshed artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/
          if git diff --staged --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git commit -m "ci: refresh model artifacts (${{ inputs.client }})"
          git push
